 const wl=l=>ST.loc=='All'?1:Math.max(1,l.loc.length),qBy={};const byId={};rows.forEach(r=>byId[r.id]=r);L.forEach(l=>{let x=l.h&&byId[l.h.id];while(x){qBy[x.id]=(qBy[x.id]||0)+l.e/wl(l);x=byId[x.par]}});

 const kp=[['Budget (MIS)',M?sh(bud):'-'],['Spent to date',M?sh(sp)+' ('+pc(sp,bud)+' of budget)':'-'],['Balance',M?sh(bud-sp):'-'],['Year elapsed vs spent',M?Math.round(el*100)+'% elapsed / '+pc(sp,bud)+' spent':'-'],['QPBP planned',Q?sh(qv)+' ('+L.length+' lines)':'-'],['QPBP lines stuck',Q?sk.length+' / '+L.length:'-']];

 hd1.filter(r=>r.b>0&&r.t>0&&r.t/(cur+1)*12>1.05*r.b).forEach(r=>al.push(['warn',`${r.c} ${r.n}: at the current monthly pace it would reach ${sh(r.t/(cur+1)*12)} against a budget of ${sh(r.b)}`]));

 if(sk.length)al.push(['bad',sk.length+' QPBP lines are stuck (overdue or no status)']);const nl=L.filter(l=>M&&!l.h).length;if(nl)al.push(['warn',nl+' QPBP lines could not be linked to an MIS head']);

 app.innerHTML=`<details class="card"><summary style="cursor:pointer">QPBP lines matched to this project: ${Lall.length} of ${(Q||[]).length} <span class="leg">(Project/Programme + Donor + Budget head matched with the MIS - click to review)</span></summary><div class="sub" style="margin-top:8px">Lines are matched to this project using the QPBP columns Project / Programme + Donor + Budget head, compared with the heads in this project's MIS. Click a group to add or remove it manually.</div><div class="chips">${(()=>{const G={};(Q||[]).forEach(l=>G[gk(l)]=(G[gk(l)]||0)+1);return Object.keys(G).map(v=>`<button class="${PJ.qk.includes(v)?'on':''}" onclick="togQ(decodeURIComponent('${encodeURIComponent(v)}'))">${E(v.replace(' | ',' \u00b7 '))} (${G[v]})</button>`).join('')||'<span class="sub">Upload the QPBP first</span>'})()}</div>${!M?'<div class="warn">No MIS yet - upload it above to see budget and spend.</div>':''}</details>

 <div class="card"><h2>Alerts</h2>${al.map(a=>`<div class="${a[0]}">&#9679; ${E(a[1])}</div>`).join('')||'<span class="ok">No alerts</span>'}</div>
 ${M?`<div class="card"><h2>Budget vs spend by head <span class="leg">| marks the share of the year elapsed</span></h2><div class="sc"><table><tr><th>Head</th><th class="n">Budget</th><th class="n">Spent</th><th class="n">Balance</th><th>Spend progress</th><th class="n">% spent</th><th class="n">QPBP planned</th></tr>${hd}</table></div></div>
 <div class="card"><h2>Monthly spend <span class="leg"><span style="color:var(--bar)">&#9632;</span> spent <span style="color:var(--warn)">- - -</span> even monthly budget (budget / 12)</span></h2>${tr}</div>
